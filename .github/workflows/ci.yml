name: CI

on:
  push:
    branches: [main]
    # A tag build is what publishes. Without this the `release` job proves the
    # R8 build compiles on every push and nothing more — pushing v0.1.0 ran no
    # workflow at all and produced no artifact.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint, detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: detekt
        run: ./gradlew detekt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/detekt/
          if-no-files-found: ignore

  release:
    name: Signed release APK
    needs: build
    runs-on: ubuntu-latest
    # Only the publish step needs write access, and only on a tag. Declared at
    # job scope because that is the narrowest scope GitHub Actions offers.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The keystore and its passwords live in repository secrets. Without
      # them the release build still runs, unsigned, so forks and secret-less
      # runs prove the R8 build compiles.
      - name: Materialise the release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.BASCULE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BASCULE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BASCULE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=bascule\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Assemble release
        run: ./gradlew assembleRelease

      # Every run states which key signed the artifact, so a swapped or
      # missing key is visible in the log rather than discovered on install.
      - name: Print signer
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'Verifies|SHA-256' || echo "unsigned build (no keystore secrets)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # An upload-artifact APK expires with the run's retention window and is
      # only reachable from the Actions tab, so it is not a release. This is
      # what actually publishes one, and only for a tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Fail loudly rather than publish an unsigned build. The keystore
          # steps above are deliberately fail-open so a secret-less fork still
          # proves R8 compiles — which means an unsigned APK CAN reach here if
          # the secrets are ever missing or renamed. Shipping one would be
          # worse than shipping nothing: its signature differs from the
          # installed app, so nobody could update in place, and this project
          # has no way to re-sign an install after the fact.
          if ! "$BT/apksigner" verify "$APK"; then
            echo "::error::refusing to publish an unsigned APK — check the BASCULE_KEYSTORE_* secrets"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
