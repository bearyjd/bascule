name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint, detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: detekt
        run: ./gradlew detekt

      # Phase 2 ships contract tests that are red on purpose: they hold open the
      # behaviour the session layer does not implement yet (WP-06/07/10). They
      # run in their own step, non-blocking, so an expected failure is visible
      # without masking a regression in the step above.
      # See docs/prp/02-ci-notes.md. Phase 3 flips this step to blocking.
      - name: Phase 2 contract tests (expected red until WP-10)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest -Pbascule.contractTests=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/detekt/
          if-no-files-found: ignore
